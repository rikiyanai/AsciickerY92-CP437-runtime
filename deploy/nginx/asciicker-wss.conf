map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting zones — RQ-036 (ship requirement: protect against slowloris-style attacks)
# limit_conn_zone: max 10 concurrent WebSocket connections per client IP
# limit_req_zone:  max 10 new connection requests per second per client IP
limit_conn_zone $binary_remote_addr zone=ak_conn:10m;
limit_req_zone  $binary_remote_addr zone=ak_req:10m rate=10r/s;

upstream asciicker_native_ws {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name multiplayer.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name multiplayer.example.com;

    ssl_certificate /etc/letsencrypt/live/multiplayer.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multiplayer.example.com/privkey.pem;

    # Native authoritative websocket endpoint.
    location /ws/y8/ {
        # Enforce rate limits (RQ-036)
        limit_conn ak_conn 10;
        limit_req  zone=ak_req burst=20 nodelay;

        proxy_pass http://asciicker_native_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # /health endpoint — same authoritative health check as current/candidate.
    # Enforce no rate limits here: an operator or load balancer hitting /health
    # must not be throttled the same way as WebSocket connections.
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        add_header Cache-Control no-store;
        # When upstream is entirely unreachable (process crashed), nginx would
        # normally return 502.  Intercept and map to 503 so the operator always
        # sees a single semantic for game-server unavailability.
        proxy_intercept_errors on;
        error_page 502 504 =503 @health_dead;
    }

    # Named location used by error_page above for upstream-unreachable state.
    location @health_dead {
        default_type application/json;
        return 503 '{"process_alive":false,"error":"game server unreachable"}';
    }
}
