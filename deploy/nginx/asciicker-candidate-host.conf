server {
    listen 80;
    server_name candidate-asciicker.rikiworld.com;

    root /opt/asciicker/candidate/.web;
    index index.html;

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cross-Origin-Opener-Policy same-origin;
    }

    location = / {
        expires -1;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location = /index.html {
        expires -1;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location = /asciicker.js {
        expires -1;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location = /authoritative_state.json {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ~* \.(js|data|png|ico|json)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /ws/y8/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ----------------------------------------------------------------
    # /health endpoint — proxies to game server's built-in health check.
    # Returns JSON with process_alive, tick_rate_hz, connected_players,
    # memory_mb, uptime_seconds.  Returns 503 when game server is dead.
    #
    # WHY PROXY INSTEAD OF STATIC: The previous nginx static-200 stub
    # (FL-2416) returned 200 even when the game process was dead, giving
    # operators a false-positive liveness signal.  The game server now
    # owns the authoritative health truth.
    #
    # proxy_intercept_errors: When the upstream game server is completely
    # unreachable (port closed, crash, start-limit backoff), nginx normally
    # returns 502 Bad Gateway.  We intercept that and map 502/504 to 503
    # so the operator ALWAYS sees 503 for any game-server unavailability,
    # whether partial (game server returns 503 itself) or total (nginx
    # converts upstream-connect failure to 503).  This satisfies RQ-084.
    # ----------------------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
        # no-store ensures load balancers / CDNs never cache health state
        add_header Cache-Control no-store;
        proxy_intercept_errors on;
        error_page 502 504 =503 @health_dead;
    }

    # Named location used by error_page above for upstream-unreachable state.
    location @health_dead {
        default_type application/json;
        return 503 '{"process_alive":false,"error":"game server unreachable"}';
    }
}

# TLS is added after DNS is pointed at the candidate machine and certbot issues:
#
# sudo certbot --nginx -d candidate-asciicker.rikiworld.com
#
# The resulting HTTPS server block should continue to serve:
# - root /opt/asciicker/candidate/.web
# - /ws/y8/ -> 127.0.0.1:8080
