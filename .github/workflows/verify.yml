name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-test.txt
      - run: ./scripts/run_standalone_checks.sh
      - name: Enforce standalone repository hygiene
        shell: bash
        run: |
          test -z "$(git ls-files '*.md' 'LICENSE*' '*/LICENSE*' | awk '$0 != "README.md" && $0 !~ /^docs\//')"
          test -z "$(git ls-files | awk '$0 ~ /(^|\/)(AGENTS\.md|CLAUDE\.md|CONTEXT\.md)$/')"
          test -z "$(git grep -Il -E 'environ(ment)?\.get\([^,]+,[[:space:]]*["'\''"][A-Za-z0-9_-]{32,}["'\''"]' -- . || true)"
          process_pattern='worker task descr''iption|agent instr''uctions|session trans''cript|conversation trans''cript|you are cod''ex'
          test -z "$(git grep -Il -i -E "$process_pattern" -- . ':!docs/FAILURE_LOG.md' || true)"

  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libpulse-dev
      - run: make -j2 -f makefile_server
      - run: ./.run/server --help

  terminal-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install v8
      - run: make -j2 -f makefile_game_term_mac

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "4.0.21"
          actions-cache-folder: emsdk-cache
      - run: sudo apt-get update && sudo apt-get install -y libpulse-dev
      - run: make -j2 -f makefile_server
      - run: ./build-web.sh
