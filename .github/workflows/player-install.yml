name: Player installer

on:
  push:
    branches: [main]
    tags: ['installer-check-*']
  pull_request:

permissions:
  contents: read

jobs:
  player-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Check installer and player commands
        run: |
          bash -n scripts/install-player.sh
          python -m pytest -q -p no:cacheprovider tests/test_player.py
      - name: Install and check the player as a normal user
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            sudo bash scripts/install-player.sh --user "$(id -un)" --source "$PWD"
          else
            sudo bash scripts/install-player.sh --user "$(id -un)" --ref "$GITHUB_REF_NAME"
          fi
          "$HOME/.local/bin/asciicker" --check
      - name: Check Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install-windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
